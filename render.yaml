# Render Blueprint — provisions the API and its Postgres in one deploy.
# Secrets (Stripe keys, encryption key, SendGrid) are marked `sync: false`:
# Render prompts for them in the dashboard and never stores them in git.

databases:
  - name: recoverflow-db
    databaseName: recoverflow
    plan: basic-256mb          # free tier is deleted after 30 days; basic is always-on
    postgresMajorVersion: "16"

services:
  - type: web
    name: recoverflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter              # always-on; free spins down and would miss live webhooks
    healthCheckPath: /health
    buildFilter:
      # The marketing site lives in docs/ and is served by GitHub Pages, not by
      # this service. Without this filter Render rebuilds and restarts the API on
      # every push to main, so a copy edit on a landing page takes production down
      # for the length of a Docker build for no reason.
      ignoredPaths:
        - docs/**
    disk:
      # Persists the DataProtection key ring across redeploys. Without it, every
      # deploy rotates the keys and invalidates in-flight OAuth `state`, magic-link
      # sign-in tokens, and session cookies. Small — it only holds a few key XML files.
      name: recoverflow-keys
      mountPath: /var/lib/recoverflow
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # WebApplication.CreateBuilder adds appsettings*.json with reloadOnChange:true,
      # which makes PhysicalFileProvider take an inotify watch per file. When the host
      # has exhausted its inotify instances that throws inside
      # JsonConfigurationSource.Build, before Program.cs gets a single line of its own
      # code, and the container exits. Polling needs no inotify handle. Config never
      # changes at runtime here, so the 4s poll costs us nothing.
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "true"
      - key: DataProtection__KeysPath
        value: /var/lib/recoverflow/dp-keys
      - key: Database__ConnectionString
        fromDatabase:
          name: recoverflow-db
          property: connectionString
      - key: Stripe__OAuthRedirectUri
        value: https://api.recoverflow.org/connect/stripe/callback
      - key: App__BaseUrl
        value: https://api.recoverflow.org
      - key: App__DashboardUrl
        value: https://app.recoverflow.org
      - key: Stripe__SecretKey
        sync: false
      - key: Stripe__ClientId
        sync: false
      - key: Stripe__WebhookSecret
        sync: false
      # Signing secret of the embedded Stripe Dashboard app (absec_...). Stripe only
      # generates it after the app's first upload; until it is set, /app/v1 answers 503.
      - key: Stripe__AppSigningSecret
        sync: false
      - key: Encryption__Key
        sync: false
      - key: Email__ApiKey
        sync: false
      # Verification key of SendGrid's Signed Event Webhook (Settings > Mail Settings >
      # Event Webhook). Until it is set, /webhooks/sendgrid answers 503.
      - key: Email__WebhookVerificationKey
        sync: false
