<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Where should we send the audit? | RecoverFlow</title>
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0f14;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card { max-width: 520px; width: 100%; }
  h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 12px; letter-spacing: -0.02em; }
  p { font-size: 1.05rem; color: #9fb0c0; margin: 0 0 20px; line-height: 1.55; }
  label { display: block; font-size: 0.85rem; color: #9fb0c0; margin-bottom: 6px; }
  input[type=email] {
    width: 100%; padding: 12px 14px; font-size: 1rem;
    background: #0f151c; color: #e6edf3;
    border: 1px solid #1e2733; border-radius: 10px;
  }
  input[type=email]:focus { outline: none; border-color: #7aa2f7; }
  button {
    margin-top: 14px; width: 100%; padding: 13px 16px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    background: #2f6feb; color: #fff; border: none; border-radius: 10px;
  }
  button:hover { background: #3b7dfa; }
  .note { font-size: 0.85rem; color: #6b7a8a; margin-top: 20px; line-height: 1.6; }
  .expired { color: #f87171; }
</style>
</head>
<body>
  <div class="card">
    <h1>Where should we send the audit?</h1>
    <p>We'll read the last 90 days in read-only mode and email you a one-page report.</p>

    <form id="f" method="post" action="/connect/stripe/audit/run">
      <input type="hidden" name="t" id="t">
      <label for="email">Email address</label>
      <input type="email" name="email" id="email" required autocomplete="email" placeholder="you@company.com">
      <button type="submit">Email me the report</button>
    </form>

    <p class="note" id="note">
      We request read access only. No write permissions are requested and none are used.
      We do not keep your access token, and installing this does not create an account.
    </p>
  </div>

<script>
  // The ticket names the Stripe account that authorized the audit. It carries no access
  // token, and it expires, so a stale link is useless rather than dangerous.
  var t = new URLSearchParams(location.search).get('t');
  if (t) {
    document.getElementById('t').value = t;
  } else {
    document.getElementById('f').style.display = 'none';
    document.getElementById('note').innerHTML =
      '<span class="expired">This link is missing its install token.</span><br>' +
      'Re-open the audit from your Stripe dashboard, or email admin@recoverflow.org and we will run it by hand.';
  }
</script>
</body>
</html>
