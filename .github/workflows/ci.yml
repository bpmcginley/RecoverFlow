name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The projects target net8.0; restore/build them directly rather than the
      # .slnx so CI does not depend on a newer SDK's solution-format support.
      # Building the API transitively builds Domain, Application, Infrastructure.
      - name: Restore
        run: |
          dotnet restore src/RecoverFlow.Api/RecoverFlow.Api.csproj
          dotnet restore tests/RecoverFlow.Tests.Unit/RecoverFlow.Tests.Unit.csproj
          dotnet restore tests/RecoverFlow.Tests.Integration/RecoverFlow.Tests.Integration.csproj

      - name: Build
        run: dotnet build src/RecoverFlow.Api/RecoverFlow.Api.csproj --configuration Release --no-restore

      - name: Test (Unit)
        run: dotnet test tests/RecoverFlow.Tests.Unit/RecoverFlow.Tests.Unit.csproj --configuration Release --logger "trx;LogFileName=unit.trx"

      - name: Test (Integration)
        run: dotnet test tests/RecoverFlow.Tests.Integration/RecoverFlow.Tests.Integration.csproj --configuration Release --logger "trx;LogFileName=integration.trx"

      # docs/ is what recoverflow.org serves, and it is generated. Without this
      # a bad rebuild ships broken links, drifted sitemap entries or pages that
      # lost the design system, and nothing notices until someone looks.
      - name: Validate site
        run: python3 scripts/validate_site.py

      # 24 of the 61 pages have no builder and must be edited by hand, the rest
      # must never be. Checking the split by measurement rather than by trusting
      # a list in a doc, which is how it went unnoticed for a month. Also fails
      # if a builder changed without docs/ being rebuilt from it.
      - name: Audit page sources
        run: python3 scripts/audit_page_sources.py
